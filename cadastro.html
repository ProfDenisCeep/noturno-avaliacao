<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de cadastro para inscrição em cursos técnicos integrados e subsequentes.">
    <title>Cadastro de Estudante - CEEP Cianorte</title>
    <link rel="stylesheet" href="./cadastro.css">
</head>
<body>
    <div class="background-blobs"></div>
    <main class="container">
        <form id="cadastroForm" class="glass-card">
            <h1>Cadastro de Estudante</h1>
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Modalidade</label>
                    <div class="radio-group">
                        <label><input type="radio" name="modalidade" value="Integrado" checked> Integrado</label>
                        <label><input type="radio" name="modalidade" value="Subsequente"> Subsequente</label>
                    </div>
                </div>
            </div>

            <label>Opções de Cursos (Escolha 3)</label>
            <div class="row courses">
                <select required>
                    <option value="">1ª Opção</option>
                    <option value="informatica">Informática</option>
                    <option value="mecanica">Mecânica</option>
                    <option value="eletrotecnica">Eletrotécnica</option>
                </select>
                <select required>
                    <option value="">2ª Opção</option>
                    <option value="informatica">Informática</option>
                    <option value="mecanica">Mecânica</option>
                    <option value="eletrotecnica">Eletrotécnica</option>
                </select>
                <select required>
                    <option value="">3ª Opção</option>
                    <option value="informatica">Informática</option>
                    <option value="mecanica">Mecânica</option>
                    <option value="eletrotecnica">Eletrotécnica</option>
                </select>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="tel1">Celular 01</label>
                    <input type="tel" id="tel1" placeholder="(00) 00000-0000" required>
                </div>
                <div class="input-group">
                    <label for="tel2">Celular 02</label>
                    <input type="tel" id="tel2" placeholder="(00) 00000-0000">
                </div>
            </div>

            <button type="submit" class="btn-save">Salvar Cadastro</button>
        </form>
    </main>

    <script defer>
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validação de campos obrigatórios
            const nome = document.getElementById('nome')?.value.trim();
            const modalidade = document.querySelector('input[name="modalidade"]:checked');
            const selects = this.querySelectorAll('.row.courses select');
            const tel1 = document.getElementById('tel1')?.value.trim();
            
            // Verificar se todos os campos foram preenchidos
            if (!nome || !modalidade || !tel1) {
                alert('⚠️ Por favor, preencha todos os campos obrigatórios!');
                return;
            }
            
            // Validar que todos os selects foram preenchidos
            let selectsValid = true;
            selects.forEach(select => {
                if (!select.value) {
                    selectsValid = false;
                }
            });
            
            if (!selectsValid) {
                alert('⚠️ Por favor, escolha uma opção de curso para cada seletor!');
                return;
            }
            
            alert('✅ Cadastro realizado com sucesso!');
            this.reset();
        });
    </script>
</body>
</html>
